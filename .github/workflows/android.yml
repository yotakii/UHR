name: Android app (APK)

# يبني تطبيق الموظفين للجوال عند تعديل mobile/ أو يدوياً، ويرفع ملف APK في «Artifacts» لهذا التشغيل.
# الإعدادات الاختيارية في GitHub:
#   vars.UHR_APP_URL              عنوان الخادم (الافتراضي https://atmata-uhr.duckdns.org)
#   secrets.GOOGLE_SERVICES_JSON  محتوى ملف google-services.json من Firebase (بدونه يُبنى التطبيق بلا إشعارات خارجية)
#   secrets.UHR_KEYSTORE_B64 / UHR_KEYSTORE_PASSWORD / UHR_KEY_ALIAS / UHR_KEY_PASSWORD  مفتاح توقيع الإصدار النهائي (بدونه: مفتاح التجربة)
on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - name: Server address
        run: node set-url.mjs "${{ vars.UHR_APP_URL || 'https://atmata-uhr.duckdns.org' }}"
      - name: Firebase (notifications)
        env: { GSJ: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; echo "notifications: on"
          else npm uninstall @capacitor/push-notifications --no-audit --no-fund; echo "notifications: off (no GOOGLE_SERVICES_JSON secret)"; fi
      - run: npx cap sync android
      - name: Release signing key
        env: { KS: '${{ secrets.UHR_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/app/release.keystore; echo "UHR_KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV; echo "signing: release key"
          else echo "signing: test key"; fi
      - name: Build
        working-directory: mobile/android
        env:
          UHR_KEYSTORE_PASSWORD: ${{ secrets.UHR_KEYSTORE_PASSWORD }}
          UHR_KEY_ALIAS: ${{ secrets.UHR_KEY_ALIAS }}
          UHR_KEY_PASSWORD: ${{ secrets.UHR_KEY_PASSWORD }}
        run: |
          [ -z "$UHR_KEYSTORE_PASSWORD" ] && unset UHR_KEYSTORE_PASSWORD UHR_KEY_ALIAS UHR_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PuhrVersionCode=${{ github.run_number }} -PuhrVersionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../UHR-1.0.${{ github.run_number }}.apk
          ls -la ../*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UHR-android-1.0.${{ github.run_number }}
          path: mobile/UHR-1.0.${{ github.run_number }}.apk
          retention-days: 30
