<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UHR</title>
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
button{margin-top:18px;height:48px;padding:0 28px;border:0;border-radius:12px;background:#6366f1;color:#fff;font-size:16px;font-weight:700}p{color:#94a3b8;font-size:14px;line-height:1.7}</style></head>
<body><div><h2>لا يوجد اتصال</h2><p>تحقق من اتصالك بالإنترنت ثم أعد المحاولة.<br>No connection — check your internet and try again.</p>
<button onclick="location.replace(window.UHR_URL||document.referrer||'/')">إعادة المحاولة · Retry</button></div>
<script>try{var c=window.Capacitor&&window.Capacitor.config;if(c&&c.server&&c.server.url)window.UHR_URL=c.server.url}catch(e){}</script></body></html>
