:root{--bg:#0a1020;--bg2:#0f172a;--fg:#eef2f8;--mut:rgba(238,242,248,.62);--dim:rgba(238,242,248,.4);--line:#334155;--glass:rgba(255,255,255,.045);
  --gold:#e7c27a;--gold2:#f3dca8;--acc:#818cf8;--acc2:#34d399;--primary:#6366f1;--primary-soft:rgba(99,102,241,.16);--erp:#818cf8;--uhr:#34d399;--ticker:44px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:Plex,Figtree,Tahoma,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.6}
html[lang=en] body{font-family:Figtree,Plex,sans-serif}
.disp{font-family:Plex,Outfit,sans-serif;font-weight:700;letter-spacing:0}
html[lang=en] .disp{font-family:Outfit,Plex,sans-serif;font-weight:800}
.num{font-family:Outfit,Figtree,sans-serif;font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* background */
#app{position:fixed;inset:0;overflow:hidden;transition:background .8s}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5;transition:background 1.2s}
.orb.a{width:58vw;height:58vw;inset-inline-end:-16vw;top:-22vw;background:rgba(99,102,241,.55);animation:floaty 12s ease-in-out infinite}
.orb.b{width:44vw;height:44vw;inset-inline-start:-14vw;bottom:-20vw;background:rgba(16,185,129,.32);animation:floaty 14s ease-in-out infinite reverse}
.orb.c{width:24vw;height:24vw;left:40vw;top:34vh;background:color-mix(in oklab,var(--gold) 22%,transparent);opacity:.35}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 25%,transparent 75%)}
.noise{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.6),transparent 60%)}

/* chrome */
.top{position:absolute;inset-inline:0;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(20px,3.4vw,56px)}
.brand{display:flex;align-items:center;gap:14px}
.pill{background:#fff;border-radius:14px;padding:6px 10px;display:grid;place-items:center;box-shadow:0 10px 40px -18px rgba(0,0,0,.8)}
.pill img{display:block}
.chap{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--mut);backdrop-filter:blur(8px)}
.chap b{color:var(--acc);font-weight:800;transition:color .6s}
.chap .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:live 1.4s ease-in-out infinite}
.ctrl{display:flex;align-items:center;gap:4px}
.ctrl button{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;cursor:pointer;font-size:18px}
.ctrl button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;padding:2px;margin-inline-end:6px}
.lang button{width:auto;height:30px;padding:0 10px;font-size:12px;font-weight:800;border-radius:8px;font-family:Figtree}
.lang button.on{background:var(--primary);color:#fff}
.ctrl .demo-btn{width:auto;white-space:nowrap;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(129,140,248,.5);background:var(--primary-soft);color:var(--fg);font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-inline-end:8px}
.ctrl .demo-btn:hover{background:rgba(99,102,241,.3)}

#stage{position:absolute;inset-inline:0;top:92px;bottom:calc(var(--ticker) + 64px);z-index:10;display:flex;align-items:center;padding:0 clamp(24px,6vw,110px)}
.scene{width:100%;max-height:100%}
.bottom{position:absolute;inset-inline:0;bottom:var(--ticker);z-index:20;padding:0 clamp(20px,3.4vw,56px) 14px}
.bars{display:flex;gap:4px}
.bars button{flex:1;height:4px;border:0;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;cursor:pointer;padding:0}
.bars button span{display:block;height:100%;width:0;background:var(--c,var(--acc))}
.bars button.done span{width:100%}
.bars button.cur span{animation:prog linear forwards}
.meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--dim)}
.meta .legend{display:flex;gap:16px}
.meta .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}

/* ticker */
.ticker{position:absolute;inset-inline:0;bottom:0;height:var(--ticker);z-index:30;display:flex;border-top:1px solid var(--line);background:rgba(10,16,32,.86);backdrop-filter:blur(10px)}
.ticker .lbl{display:flex;align-items:center;gap:8px;padding:0 18px;border-inline-end:1px solid var(--line);font-size:11.5px;font-weight:700;white-space:nowrap;background:#0a1020}
.ticker .lbl i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:live 1.4s infinite}
.tk-mask{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tk-track{display:flex;align-items:center;height:100%;width:max-content;animation:tkl 80s linear infinite}
[dir=rtl] .tk-track{animation-name:tkr}
.tk-item{display:flex;align-items:center;gap:8px;padding:0 16px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--mut)}
.tk-item::after{content:"";width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.2);margin-inline-start:16px}
.tile{width:40px;height:32px;border-radius:7px;background:#fff;display:grid;place-items:center;padding:3px 4px;flex-shrink:0}
.tile img{width:32px;height:26px;object-fit:contain;display:block}

/* scene primitives */
.fu{animation:fadeup .75s cubic-bezier(.2,.7,.2,1) both}
.fi{animation:fadein 1s ease both}
.zoom{animation:zoomin .9s cubic-bezier(.2,.7,.2,1) both}
.kick{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
.kick .ln{height:1px;width:44px;background:color-mix(in oklab,var(--acc) 60%,transparent)}
.kick .n{font-family:Outfit;letter-spacing:.05em}
h1.t{font-size:clamp(40px,5.4vw,92px);line-height:1.18;margin-top:14px}
h2.t{font-size:clamp(32px,4.1vw,66px);line-height:1.22;margin-top:12px}
html[lang=en] h1.t{line-height:1.05}html[lang=en] h2.t{line-height:1.1}
.sub{margin-top:14px;font-size:clamp(16px,1.45vw,22px);color:var(--mut);max-width:44ch}
.impact{margin-top:22px;border-inline-start:3px solid var(--acc);padding-inline-start:16px;font-size:clamp(15px,1.25vw,19px);font-weight:600;max-width:46ch}
.chips{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:6px 12px;font-size:13.5px}
.chip b{color:var(--acc)}
.split{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(30px,5vw,90px);align-items:center}
.card{border:1px solid var(--line);background:rgba(30,41,59,.78);border-radius:20px;padding:20px;box-shadow:0 30px 80px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:rgba(15,23,42,.8);border-radius:14px;padding:12px 16px}
.tick{width:22px;height:22px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:14px}
.tick svg{stroke-width:3}
.ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;color:var(--acc);border:1px solid color-mix(in oklab,var(--acc) 35%,transparent);background:color-mix(in oklab,var(--acc) 12%,transparent)}
.orbit{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:38px;color:var(--acc);border:1px solid color-mix(in oklab,var(--acc) 40%,transparent);background:rgba(8,16,34,.7);animation:glow 3.2s ease-in-out infinite}
.lbl-s{font-size:12px;color:var(--dim)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.04em}
.b-ess{background:var(--primary-soft);color:var(--acc);border:1px solid rgba(129,140,248,.45)}
.b-ent{background:linear-gradient(90deg,color-mix(in oklab,var(--gold) 26%,transparent),color-mix(in oklab,var(--uhr) 20%,transparent));color:var(--gold2);border:1px solid color-mix(in oklab,var(--gold) 50%,transparent)}
.stamp{border:2px solid currentColor;border-radius:6px;padding:2px 8px;font-weight:800;transform:rotate(-5deg);display:inline-block;color:var(--acc);font-size:12px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar span{position:absolute;inset-block:0;inset-inline-start:0;border-radius:9px;background:var(--acc);animation:growx 1.2s cubic-bezier(.2,.7,.2,1) both}
.phone{width:250px;border-radius:34px;border:5px solid #334155;background:#0f172a;padding:16px 14px 18px;box-shadow:0 40px 90px -40px #000}
.phone .notch{width:70px;height:6px;border-radius:9px;background:rgba(255,255,255,.14);margin:0 auto 14px}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:rgba(30,41,59,.72);border-radius:16px;padding:14px}
.mod .ic{width:40px;height:40px;font-size:20px}
.mod b{display:block;font-size:15px}
.mod small{display:block;font-size:12px;color:var(--dim)}
.stats{display:flex;flex-wrap:wrap;gap:clamp(20px,3.4vw,56px);margin-top:30px}
.stat .v{font-size:clamp(30px,3vw,48px);font-weight:900;color:var(--acc);line-height:1}
.stat .k{font-size:13.5px;color:var(--mut);margin-top:6px}
.flow{position:relative;display:grid;gap:10px}
.flow .line{position:absolute;top:36px;inset-inline:6%;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));transform-origin:var(--org);animation:growx 2.6s .5s cubic-bezier(.4,.1,.2,1) both;opacity:.6}
.node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.node .ic{width:72px;height:72px;border-radius:22px;font-size:30px;background:rgba(8,16,34,.92)}
.node b{font-size:15px}
.node small{font-size:12px;color:var(--dim);margin-top:-6px}
.matrix{display:grid;gap:6px}
.matrix .mh{font-size:11.5px;color:var(--dim);text-align:center}
.matrix .ml{font-size:13.5px;font-weight:600;display:flex;align-items:center}
.matrix .mc{height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:rgba(6,10,23,.5)}
.matrix .mc.on{background:color-mix(in oklab,var(--acc) 20%,transparent);border-color:color-mix(in oklab,var(--acc) 45%,transparent);color:var(--acc)}
.cmp{display:grid;grid-template-columns:1.6fr .7fr .9fr;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:rgba(6,10,23,.55)}
.cmp>div{padding:7px 18px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;font-size:clamp(13px,1vw,15.5px)}
.cmp .h{padding:16px 18px;font-weight:800;border-bottom:1px solid var(--line)}
.cmp .c{justify-content:center}
.cmp .ent{background:rgba(231,194,122,.07)}
.cmp .no{color:rgba(255,255,255,.22)}
.yes{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.yes svg{stroke-width:3}
.y1{background:var(--primary-soft);color:var(--acc)}
.y2{background:var(--gold);color:#2a1d00}
.cta{display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 30px;border-radius:16px;border:0;background:linear-gradient(90deg,#6366f1,#818cf8);color:#fff;font:inherit;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 20px 60px -20px #6366f1}
.cta:hover{filter:brightness(1.08)}
.tier{border-radius:26px;padding:28px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.tier.ent{border-color:color-mix(in oklab,var(--gold) 50%,transparent);background:linear-gradient(160deg,color-mix(in oklab,var(--gold) 12%,transparent),color-mix(in oklab,var(--uhr) 10%,transparent) 60%,rgba(255,255,255,.02));box-shadow:0 0 0 1px color-mix(in oklab,var(--gold) 20%,transparent),0 40px 120px -40px color-mix(in oklab,var(--uhr) 60%,transparent)}
.tier ul{list-style:none;margin-top:16px;display:grid;gap:9px}
.tier li{display:flex;gap:10px;align-items:center;font-size:15px}
.tier li .tick{width:20px;height:20px;font-size:12px}
.wordmark{font-family:Outfit;font-weight:900;letter-spacing:.02em;background:linear-gradient(100deg,#fff 10%,#a5b4fc 55%,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr}
.otp span{width:30px;height:40px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-family:Outfit;font-weight:800;font-size:20px;background:rgba(255,255,255,.04)}
.toast{display:flex;gap:10px;align-items:center;border:1px solid color-mix(in oklab,var(--acc) 45%,transparent);background:rgba(8,16,34,.92);border-radius:14px;padding:10px 14px;font-size:13.5px;box-shadow:0 20px 50px -20px #000}

@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes zoomin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes prog{from{width:0}to{width:100%}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes glow{0%,100%{box-shadow:0 0 40px -8px color-mix(in oklab,var(--acc) 70%,transparent)}50%{box-shadow:0 0 80px 0 color-mix(in oklab,var(--acc) 70%,transparent)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes tkl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes tkr{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes sig{to{stroke-dashoffset:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--acc) 55%,transparent)}100%{box-shadow:0 0 0 46px transparent}}
@keyframes glowg{0%,100%{box-shadow:0 0 18px -4px var(--gold)}50%{box-shadow:0 0 40px 2px var(--gold)}}
@keyframes goldon{to{border:2px solid var(--gold);color:var(--gold2);background:rgba(231,194,122,.16);box-shadow:0 0 30px -8px var(--gold)}}
@keyframes goldtx{to{color:var(--gold2)}}
@keyframes spin{to{transform:rotate(360deg)}}
.bar span,.flow .line{transform-origin:var(--org)}
[dir=rtl]{--org:right}[dir=ltr]{--org:left}
@media (max-width:1100px){.split{grid-template-columns:1fr}.split>:last-child{display:none}.mod-grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

}

  document.getElementById('bars').innerHTML = S.map((s, k) => `<button class="${k < i ? 'done' : k === i ? 'cur' : ''}" style="--c:${CH[s.ch][0]}" aria-label="${k + 1}"><span ${k === i ? `style="animation-duration:${S[k].dur}ms;animation-play-state:${paused ? 'paused' : 'running'}"` : ''}></span></button>`).join('');
  document.querySelectorAll('#bars button').forEach((b, k) => b.onclick = () => go(k));
  document.getElementById('count').textContent = String(i + 1).padStart(2, '0') + ' / ' + S.length;
}
function fit() {
  const z = Math.max(.72, Math.min(1.55, innerWidth / 1480, (innerHeight - 200) / 680));
  const sc = stage.querySelector('.scene');
  if (sc) { sc.style.zoom = 1; const h = sc.getBoundingClientRect().height, H = stage.clientHeight; sc.style.zoom = Math.min(z, (H * .97) / h); }
  const zt = Math.max(.85, Math.min(1.35, innerWidth / 1500));
  document.querySelector('.top').style.zoom = zt; document.querySelector('.bottom').style.zoom = zt;
}
addEventListener('resize', fit);
function show() {
  const s = S[i]; app.dataset.ch = s.ch; curCh = s.ch;
  document.getElementById('chap').innerHTML = `<b>${t(CH[s.ch][1], CH[s.ch][2])}</b>`;
  const html = s.render().replace(/style="([^"]*)"(\s+)style="([^"]*)"/g, 'style="$1;$3"');
  stage.innerHTML = `<div class="scene">${html}</div>`; fit(); countUp(stage); bars();
  clearTimeout(timer); if (!paused) timer = setTimeout(() => go(i + 1, true), s.dur);
}
function go(n, auto) {
  if (auto && n >= S.length) { lang = lang === 'ar' ? 'en' : 'ar'; chrome() }
  i = (n + S.length) % S.length; show();
}
function setPaused(p) { paused = p; chrome(); if (paused) clearTimeout(timer); show() }
function openDemo() { window.open(UHR_DEMO, '_blank') }
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.l; chrome(); show() });
document.getElementById('prev').onclick = () => go(i - 1);
document.getElementById('next').onclick = () => go(i + 1);
document.getElementById('pp').onclick = () => setPaused(!paused);
document.getElementById('live').onclick = openDemo;
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); setPaused(!paused) } if (e.key === 'ArrowRight') go(lang === 'ar' ? i - 1 : i + 1); if (e.key === 'ArrowLeft') go(lang === 'ar' ? i + 1 : i - 1); if (e.key.toLowerCase() === 'f') document.getElementById('fs').click(); if (e.key.toLowerCase() === 'l') { lang = lang === 'ar' ? 'en' : 'ar'; chrome(); show() } });
const q = new URLSearchParams(location.search); if (q.get('lang') === 'en') lang = 'en'; if (q.get('s')) i = +q.get('s'); if (q.get('pause')) paused = true;
chrome(); show();
</script>
