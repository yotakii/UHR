# الواجهة والـ API على نفس الأصل (كوكي الجلسة + CSRF) — Nginx Proxy Manager أمامه يضيف HTTPS

# برامج معاينة الروابط (لا تشغّل الواجهة) — تأخذ وسوم og:* من Laravel لنفس المسار (ملاحظة الاختبار 33)
map $http_user_agent $uhr_preview_bot {
    default 0;
    ~*(facebookexternalhit|facebookcatalog|meta-externalagent|whatsapp|telegrambot|twitterbot|linkedinbot|slackbot|discordbot|skypeuripreview|pinterest|vkshare|embedly|redditbot|applebot|google-inspectiontool|bingpreview|viber) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # كل /api → Laravel (public/index.php داخل حاوية api)
    location /api/ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # البث اللحظي: WebSocket إلى خادم Reverb (Nginx Proxy Manager يحتاج تفعيل «Websockets Support»)
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # خريطة الموقع لمحركات البحث (SRS §10.15)
    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/sitemap.xml;
    }

    # ملفات البناء بأسماء مختومة — تخزين طويل
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # معاينة الروابط: نفس المسار يُقدَّم من Laravel بوسوم og:* وصورة عريضة
    location @preview {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param QUERY_STRING path=$uri;
        fastcgi_param REQUEST_URI /api/public/og?path=$uri;
    }

    # تطبيق الصفحة الواحدة: كل مسار آخر يفتح index.html (وبرامج المعاينة تذهب إلى @preview)
    location / {
        error_page 418 = @preview;
        if ($uhr_preview_bot) { return 418; }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
